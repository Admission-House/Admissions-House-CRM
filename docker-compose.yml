# One-machine deployment: PostgreSQL, a one-off migration job, and the API.
# Put the secrets in a file named .env.production next to this file (see ops/README.md), then:
#   docker compose --env-file .env.production up -d --build
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: admission_house
      POSTGRES_USER: ah_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ah_owner -d admission_house']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ['sh', '-c', 'node db/migrate.mjs && node db/seed-locations.mjs']
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATOR_DATABASE_URL: postgres://ah_owner:${OWNER_DB_PASSWORD}@db:5432/admission_house
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    restart: 'no'

  # Scans every uploaded document. The first start downloads the virus definitions, which takes a few minutes.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ah_app:${APP_DB_PASSWORD}@db:5432/admission_house
      STORAGE_DIR: /data/storage
      CLAMAV_HOST: clamav
    volumes:
      - storage:/data/storage
    ports:
      - '127.0.0.1:3001:3001' # put a reverse proxy with HTTPS in front; do not expose this port directly

  # The web CRM. The browser talks to this container; it passes /api/v1 on to the API.
  # Put the reverse proxy in front of both: send /api/v1/ws (WebSocket) and /api/v1 to the API
  # (port 3001) and everything else to the web app (port 3000), under one HTTPS address.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_URL: http://api:3001
        NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-Admissions House CRM}
        NEXT_PUBLIC_LOGIN_EYEBROW: ${NEXT_PUBLIC_LOGIN_EYEBROW:-}
        NEXT_PUBLIC_LOGIN_TITLE: ${NEXT_PUBLIC_LOGIN_TITLE:-}
        NEXT_PUBLIC_LOGIN_TAGLINE: ${NEXT_PUBLIC_LOGIN_TAGLINE:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  clamdb:
  pgdata:
  storage:
