name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admission_house
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MIGRATOR_DATABASE_URL: postgres://postgres:postgres@localhost:5432/admission_house
      APP_DB_PASSWORD: ci-app-password
      DATABASE_URL: postgres://ah_app:ci-app-password@localhost:5432/admission_house
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate
        working-directory: apps/api
        run: node db/migrate.mjs
      - name: Lint
        run: pnpm --filter @ah/api lint
      - name: Typecheck
        run: pnpm --filter @ah/api typecheck
      - name: Unit tests
        run: pnpm --filter @ah/api test
      - name: End-to-end tests
        run: pnpm --filter @ah/api test:e2e
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web CRM, lint and type check
        run: pnpm --filter @ah/web lint && pnpm --filter @ah/web typecheck
      - name: Mobile app, lint and type check
        run: pnpm --filter @ah/mobile lint && pnpm --filter @ah/mobile typecheck

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
